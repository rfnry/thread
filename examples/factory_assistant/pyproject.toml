[project]
name = "factory_assistant"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "rfnry-engine",
    "rfnry-memory",
    "rfnry-thread",
    "voyageai",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-thread = { path = "../../packages/python", editable = true }
rfnry-engine = { path = "../../../engine/packages/python", editable = true }
rfnry-memory = { path = "../../../memory/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["providers"]
