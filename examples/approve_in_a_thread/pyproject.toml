[project]
name = "approve_in_a_thread"
version = "0"
requires-python = ">=3.12"
dependencies = ["rfnry-thread", "rfnry-engine", "anthropic", "google-genai", "httpx"]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-thread = { path = "../../packages/python", editable = true }
rfnry-engine = { path = "../../../engine/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["client", "harness", "providers", "server"]
