<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Clinic nurse desk</title>
    <style>
      body { font: 15px/1.45 system-ui, sans-serif; max-width: 64rem; margin: 2rem auto; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.5rem; }
      #app { display: grid; grid-template-columns: 16rem 1fr; gap: 2rem; }
      aside ul { padding-left: 1rem; }
      aside li button { all: unset; cursor: pointer; text-decoration: underline; }
      .user, .assistant { white-space: pre-wrap; padding: 0.5rem 0.75rem; border-radius: 0.5rem; }
      .user { background: #e8f0fe; }
      .assistant { background: #f2f2f2; }
      [data-who]::before { content: attr(data-who); display: block; font-size: 0.8em; color: #666; }
      #handled, #status { color: #666; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>Acme Clinic nurse desk</h1>
    <form id="signin">
      <input id="name" placeholder="Your name" required />
      <select id="clinic">
        <option value="clinic-northside">Northside</option>
        <option value="clinic-riverside">Riverside</option>
      </select>
      <button>Start</button>
    </form>
    <div id="app" hidden>
      <aside>
        <form id="open">
          <input id="patient" placeholder="Patient's name" required />
          <button>Open</button>
        </form>
        <ul id="threads"></ul>
      </aside>
      <main id="thread" hidden>
        <h2 id="title"></h2>
        <p id="handled"></p>
        <button id="handoff">A nurse takes over</button>
        <div id="log"></div>
        <p id="status"></p>
        <form id="say">
          <input id="text" placeholder="What the patient said" autocomplete="off" required />
          <button>Send</button>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
