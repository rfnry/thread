[project]
name = "healthcare_assistant"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "rfnry-thread[postgres]",
    "rfnry-engine",
    "anthropic",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-thread = { path = "../../packages/python", editable = true }
rfnry-engine = { path = "../../../engine/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["harness", "providers", "routes", "server", "utils"]
