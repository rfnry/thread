<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant</title>
    <style>
      body { font: 15px/1.45 system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.5rem; }
      #app { display: grid; grid-template-columns: 14rem 1fr; gap: 2rem; }
      aside ul { padding-left: 1rem; }
      aside li button { all: unset; cursor: pointer; text-decoration: underline; }
      .user, .assistant { white-space: pre-wrap; padding: 0.5rem 0.75rem; border-radius: 0.5rem; }
      .user { background: #e8f0fe; margin-left: 4rem; }
      .assistant { background: #f2f2f2; margin-right: 4rem; }
      [data-who]::before { content: attr(data-who); display: block; font-size: 0.8em; color: #666; }
      #status { color: #666; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>Assistant</h1>
    <form id="signin">
      <input id="name" placeholder="Your name" required />
      <button>Start</button>
    </form>
    <div id="app" hidden>
      <aside><ul id="threads"></ul></aside>
      <main>
        <p id="waiting">Nothing yet: the assistant writes first.</p>
        <div id="log"></div>
        <p id="status"></p>
        <form id="say" hidden>
          <input id="text" autocomplete="off" required />
          <button>Send</button>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
