[project]
name = "two_replicas"
version = "0"
requires-python = ">=3.12"
dependencies = ["rfnry-thread[postgres]"]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-thread = { path = "../../packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
